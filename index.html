<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Project OS — 1.0 Shell (MOCK)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 240px; background: #1e293b; padding: 16px; border-right: 1px solid #334155; }
    .main { flex: 1; padding: 24px; overflow: auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    .btn:hover { background: #2563eb; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px; }
    .badge.mock { background: #f59e0b; color: black; }
    .badge.real { background: #10b981; color: white; }
    input { background: #334155; border: 1px solid #475569; color: #e2e8f0; padding: 8px; border-radius: 4px; width: 100%; margin-bottom: 8px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    h2 { font-size: 18px; margin-bottom: 12px; color: #94a3b8; }
    .nav-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; }
    .nav-item:hover { background: #334155; }
    .nav-item.active { background: #3b82f6; }
    .status { font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
