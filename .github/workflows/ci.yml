name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: '**/*.md'

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check relative links offline
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  dag-validate:
    name: Dependency DAG cycle check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate DAG (no cycles)
        run: python scripts/validate_dag.py

  wp1a-fixture-test:
    name: WP1-A fixture validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run WP1-A fixture harness
        run: python tests/wp1a/test_wp1a.py

  checksum-verify:
    name: Manifest checksum verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify manifest hashes (strict)
        run: python .github/scripts/verify_checksums.py

  checksum-verify-negative:
    name: Checksum verification negative test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prove a corrupted hash fails
        run: |
          python - <<'PY'
          import json, pathlib, shutil, subprocess, sys, tempfile

          root = pathlib.Path('.')
          work = pathlib.Path(tempfile.mkdtemp()) / 'repo'
          shutil.copytree(root, work)

          manifest = json.loads((work / 'manifest.json').read_text())
          target = manifest['files'][0]

          # Corrupt the checksum entry for target.
          lines = (work / 'CHECKSUMS.sha256').read_text().splitlines()
          out = []
          corrupted = False
          for line in lines:
              parts = line.split()
              if len(parts) >= 2 and parts[1] == target:
                  out.append('0' * 64 + '  ' + target)
                  corrupted = True
              else:
                  out.append(line)
          (work / 'CHECKSUMS.sha256').write_text('\n'.join(out) + '\n')
          assert corrupted, 'target not found in checksums'

          r = subprocess.run([sys.executable, '.github/scripts/verify_checksums.py'], cwd=work, capture_output=True, text=True)
          print('corrupted-hash exit code:', r.returncode)
          if r.returncode == 0:
              print('FAIL: corrupted checksum was not detected')
              sys.exit(1)
          print('PASS: corrupted checksum detected')

          # Remove the entry entirely.
          lines2 = [l for l in (work / 'CHECKSUMS.sha256').read_text().splitlines()
                    if not (l.split() and l.split()[-1] == target)]
          (work / 'CHECKSUMS.sha256').write_text('\n'.join(lines2) + '\n')
          r2 = subprocess.run([sys.executable, '.github/scripts/verify_checksums.py'], cwd=work, capture_output=True, text=True)
          print('missing-entry exit code:', r2.returncode)
          if r2.returncode == 0:
              print('FAIL: missing checksum entry was not detected')
              sys.exit(1)
          print('PASS: missing checksum entry detected')
          print('All negative checks passed.')
          PY

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  wp1a-build-test:
    name: WP1-A build + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Domain tests (no DB)
        run: npm run test
      - name: DB tests (Testcontainers, requires Docker)
        run: npm run test:db
        env:
          # No ambient DATABASE_URL/ADMIN_URL — container provides connection
          WP1A_TEST_OPT_IN: 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check docs/46 exists and is in manifest
        run: |
          python - <<'PY'
          import json, pathlib, sys
          doc = pathlib.Path('docs/46-acceptance-and-remote-evidence-contract.md')
          if not doc.is_file():
              print('FAIL: docs/46-acceptance-and-remote-evidence-contract.md is missing')
              sys.exit(1)
          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          files = manifest.get('files', [])
          if 'docs/46-acceptance-and-remote-evidence-contract.md' not in files:
              print('FAIL: docs/46-acceptance-and-remote-evidence-contract.md is not listed in manifest.json')
              sys.exit(1)
          print('PASS: docs/46 present and included in manifest')
          PY
